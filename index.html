<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Power BI</title>
  <style>
    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 16px 24px;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mi Dashboard</h1>
  </header>
  <main>
    <div class="frame">
      <!-- Reemplaza el valor de src por la URL que te da "Publicar en la web" en Power BI -->
      <iframe
        title="Dashboard Power BI"
        src="PEGA_AQUI_TU_URL_DE_POWER_BI"
        allowfullscreen="true">
      </iframe>
    </div>
  </main>
</body>
</html>
